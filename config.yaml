# Configuration for Nonlinear Market Dynamics Pipeline

data:
  raw_path: "data/raw/market_data.csv" # Or parquet
  processed_path: "data/processed/clean_data.parquet"
  target_col: "price"
  time_col: "time"
  test_split: 0.2

preprocessing:
  denoise_method: "wavelet" # or "moving_average"
  window_size: 10
  wavelet_name: "db4"
  wavelet_level: 2

phase_space:
  tau_max: 50 # Max delay to search
  m_max: 10 # Max embedding dimension to search
  n_neighbors: 10
  tau: 5 # Initial Takens tau
  embedding_dim: 4 # Initial Takens m

ou_process:
  alpha: 5
  mu: 48.22
  sigma: 5
  x0: 62.24

risk_aversion:
  gamma_values: [1, 2.5, 5, 10]

time_horizons:
  values: [50, 150]

convenience_yield:
  values: [0.08, 0.05, -0.08]

regime_transition:
  matrix: 
    - [0.75, 0.25, 0, 0]
    - [0.25, 0.75, 0, 0]
    - [0, 0, 0.25, 0.7]
    - [0, 0, 0.75, 0.25]

regime_detection:
  n_components: 3 # Number of hidden states for HMM
  hmm_covariance_type: "full"
  hmm_n_iter: 100
  cpd_model: "l2" # Ruptures cost function
  cpd_penalty: 10

dynamics:
  sindy:
    polynomial_degree: 3
    threshold: 0.1
    alpha: 0.05
  
  neural_ode:
    hidden_dim: 64
    num_layers: 3
    activation: "tanh"
    batch_time: 10
    batch_size: 128
    epochs: 1000
    lr: 0.001
    test_freq: 50
    solver: "rk4" # or dopri5

wandb:
  project: "nonlinear_market_dynamics"
  entity: null
  mode: "offline" # Change to online for actual logging
